<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Task Juggler — Mock Harness</title></head>
<body>
<p style="font: 12px monospace; opacity: 0.6;">
  Mock harness: window.cowork is a fake seeded with real captured fixture shapes.
  Open dev tools console to see callMcpTool/askClaude call logs.
</p>
<script type="module">
  import {
    MOCK_TOOL_NAMES, MOCK_SLACK_THREAD_V1, MOCK_LINEAR_ISSUE,
    MOCK_LINEAR_DISCOVERY_ISSUE, MOCK_TODOIST_DISCOVERY_ITEM, MOCK_SLACK_DISCOVERY_THREAD,
  } from './mock-fixtures.js';

  const state = { slackVersion: 1, breakLinearGlobex: false, breakSlackAskClaude: false, hangSlackSearch: false };
  window.__JUGGLER_TOOL_NAMES__ = MOCK_TOOL_NAMES;

  window.__jugglerToolCalls = [];
  window.cowork = {
    async callMcpTool(name, args) {
      console.log('[mock callMcpTool]', name, args);
      window.__jugglerToolCalls.push({ name, args });
      if (name === `${MOCK_TOOL_NAMES.linearWorkspaces.Globex}list_issues` && state.breakLinearGlobex) {
        throw new Error('connector invalidated, needs reconnect');
      }
      if (name === MOCK_TOOL_NAMES.slackSearch && state.hangSlackSearch) {
        return new Promise(() => {}); // never resolves — reproduces the reported "stuck at Refresh…" hang
      }
      if (name === MOCK_TOOL_NAMES.slackReadThread) {
        // Real, live-captured envelope: {messages, pagination_info} serialized
        // as JSON — NOT a bare text blob. The earlier bare-blob mock is what
        // let a real production bug (every thread "fetch-failed") pass here.
        const text = args.channel_id === MOCK_SLACK_DISCOVERY_THREAD.channelId
          ? MOCK_SLACK_DISCOVERY_THREAD.rawText
          : (state.slackVersion === 1 ? MOCK_SLACK_THREAD_V1.rawText : MOCK_SLACK_THREAD_V1.rawText + '\nNEW REPLY');
        return {
          content: [{ text: JSON.stringify({ messages: text, pagination_info: 'There are no more messages in this thread.\n' }) }],
          isError: false,
        };
      }
      if (name === `${MOCK_TOOL_NAMES.linearWorkspaces.Acme}get_issue`) {
        return { structuredContent: MOCK_LINEAR_ISSUE, isError: false };
      }
      if (name === `${MOCK_TOOL_NAMES.linearWorkspaces.Acme}list_issues`) {
        return { structuredContent: { issues: [MOCK_LINEAR_DISCOVERY_ISSUE] }, isError: false };
      }
      if (name === `${MOCK_TOOL_NAMES.linearWorkspaces.Globex}list_issues`) {
        return { structuredContent: { issues: [] }, isError: false };
      }
      if (name === MOCK_TOOL_NAMES.todoistFindTasks) {
        return { structuredContent: { tasks: [MOCK_TODOIST_DISCOVERY_ITEM] }, isError: false };
      }
      if (name === MOCK_TOOL_NAMES.slackSearch) {
        return { content: [{ text: MOCK_SLACK_DISCOVERY_THREAD.searchSnippet }], isError: false };
      }
      return { content: [{ text: '{}' }], isError: true };
    },
    async askClaude(prompt) {
      console.log('[mock askClaude]', prompt.slice(0, 120) + '…');
      // Reproduces the real production failure verbatim: a batch Slack
      // classification call whose "prompt" argument the Cowork bridge
      // rejects outright, thrown (not returned) from askClaude. Before the
      // fix, this was unguarded and propagated out through Promise.all in
      // main.js, wiping out Linear/Todoist/session results from the SAME
      // refresh cycle. After the fix it should surface only in the errors
      // dropdown, with everything else still populating normally.
      if (state.breakSlackAskClaude && prompt.includes('triaging a batch of Slack threads')) {
        throw new Error(
          'Error invoking remote method \'$eipc_message$_699a1464-945b-4143-a09c-275519ade04d_$_claude.coworkArtifact_$_CoworkArtifactBridge_$_askClaude\': '
          + 'Error: Argument "prompt" at position 0 to method "askClaude" in interface "CoworkArtifactBridge" failed to pass validation'
        );
      }
      if (prompt.includes('triaging a batch of Slack threads')) {
        const keys = [...prompt.matchAll(/--- Thread (\S+) ---/g)].map((m) => m[1]);
        const verdicts = keys.map((threadKey) => (
          threadKey.includes(MOCK_SLACK_DISCOVERY_THREAD.channelId)
            ? {
              threadKey, isOngoing: true, ballInUsersCourt: true, waitingOn: 'user',
              status: 'not_started', summary: 'Priya asked Dana to review pricing copy', reason: 'unanswered request',
            }
            : {
              threadKey, isOngoing: true, ballInUsersCourt: true, waitingOn: 'user',
              status: 'waiting_other', summary: 'Devin asked whether to add the release to the changelog.', reason: 'unanswered bot question',
            }
        ));
        return JSON.stringify(verdicts);
      }
      if (prompt.includes('triaging the tail of an AI')) {
        return JSON.stringify({
          needsAttention: true, waitingOn: 'user',
          reason: 'Needs you to submit the W-9 tax form',
        });
      }
      return JSON.stringify({
        status: 'in_progress', summary: 'Issue is in triage, needs a resolution decision.',
        nextAction: 'Decide backfill approach for the 9 affected plans', waitingOn: 'user',
        ballInUsersCourt: true, estRemaining: 'medium', done: false,
      });
    },
  };

  // Helper for the Browser tool (via javascript_tool, for test setup only) to
  // flip the Slack fixture to its "changed" version, to exercise the cache-miss
  // path live.
  window.__jugglerFlipSlackFixture = () => { state.slackVersion = 2; };

  // Simulates a connector going into an "invalidated, needs reconnect" state
  // (a real failure mode found via a live MCP probe) — exercises the
  // resilience path and the errors dropdown without touching the other
  // sources.
  window.__jugglerBreakLinearGlobex = () => { state.breakLinearGlobex = true; };
  window.__jugglerBreakSlackAskClaude = () => { state.breakSlackAskClaude = true; };
  // Reproduces the real production report: a callMcpTool call (Slack search,
  // in this case) that hangs instead of rejecting. Before the timeout fix,
  // this left the whole refresh stuck at "Refresh…" forever with no error.
  window.__jugglerHangSlackSearch = () => { state.hangSlackSearch = true; };

  window.__jugglerErrors = [];
  window.addEventListener('error', (e) => {
    window.__jugglerErrors.push(String(e.error?.stack || e.message));
    console.error('[harness caught error]', e.error?.stack || e.message);
  });

  const res = await fetch('../dist/task-juggler.html');
  const html = await res.text();
  const styleMatch = html.match(/<style>([\s\S]*?)<\/style>/);
  const style = document.createElement('style');
  style.textContent = styleMatch[1];
  document.head.appendChild(style);
  const bodyMatch = html.match(/<body>([\s\S]*)<\/body>/);
  document.body.innerHTML = bodyMatch[1];
  const scriptMatch = html.match(/<script type="module">([\s\S]*?)<\/script>\s*<\/body>/);
  const script = document.createElement('script');
  script.type = 'module';
  script.textContent = scriptMatch[1];
  document.body.appendChild(script);
</script>
</body>
</html>

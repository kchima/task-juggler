<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Task Juggler</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 16px; background: #fff; color: #111; }
  @media (prefers-color-scheme: dark) { body { background: #16181c; color: #e8e8e8; } }
  header { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; margin-right: auto; }
  button { font: inherit; cursor: pointer; border: 1px solid #999; background: transparent; color: inherit; border-radius: 6px; padding: 4px 10px; }
  button:hover { background: rgba(128,128,128,0.15); }
  #jg-add-input { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid #999; background: transparent; color: inherit; flex: 1; min-width: 160px; }
  #jg-lookback-label { font-size: 12px; opacity: 0.7; white-space: nowrap; }
  #jg-lookback-input { font: inherit; padding: 3px 6px; border-radius: 6px; border: 1px solid #999; background: transparent; color: inherit; }
  #jg-status { font-size: 12px; opacity: 0.7; }
  .jg-row { display: flex; gap: 8px; align-items: center; padding: 6px 4px; border-bottom: 1px solid rgba(128,128,128,0.25); font-size: 14px; }
  .jg-row-completed { opacity: 0.55; text-decoration: line-through; }
  .jg-chip { font-size: 11px; padding: 2px 8px; white-space: nowrap; }
  .jg-chip-waiting_ai, .jg-chip-waiting_other { opacity: 0.7; }
  .jg-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 320px; flex-shrink: 0; }
  /* A linked title is a promise that clicking jumps to the real source. */
  a.jg-title-linked { color: inherit; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; cursor: pointer; }
  a.jg-title-linked:hover { text-decoration-style: solid; color: #2f6feb; }
  @media (prefers-color-scheme: dark) { a.jg-title-linked:hover { color: #7aa7ff; } }
  .jg-card-title { text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 4px; }
  .jg-summary { opacity: 0.75; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .jg-badge { font-size: 11px; padding: 2px 6px; border-radius: 10px; border: 1px solid rgba(128,128,128,0.5); white-space: nowrap; flex-shrink: 0; }
  .jg-badge-user { border-color: #d08700; color: #d08700; font-weight: 600; }
  .jg-completed-header { font-size: 12px; opacity: 0.6; margin: 10px 0 4px; }
  .jg-refresh, .jg-delete, .jg-reopen { flex-shrink: 0; }
  .jg-card { border: 1px solid rgba(128,128,128,0.35); border-radius: 10px; padding: 16px; max-width: 480px; }
  .jg-card h2 { margin: 0 0 8px; font-size: 18px; }
  #jg-errors { font-size: 12px; margin-bottom: 10px; }
  #jg-errors summary { cursor: pointer; color: #b45309; user-select: none; }
  #jg-errors ul { margin: 6px 0 0; padding-left: 18px; opacity: 0.85; }
  #jg-errors li { margin-bottom: 2px; }
  @media (prefers-color-scheme: dark) { #jg-errors summary { color: #f0b429; } }
  #jg-candidates { font-size: 12px; margin-bottom: 10px; opacity: 0.85; }
  #jg-candidates > summary { cursor: pointer; user-select: none; }
  #jg-candidates details { margin: 4px 0 4px 14px; }
  #jg-candidates details summary { cursor: pointer; user-select: none; }
  #jg-candidates ul { margin: 4px 0 0; padding-left: 18px; }
  #jg-candidates li { margin-bottom: 2px; }
  #jg-candidates li.jg-candidate-empty { opacity: 0.6; font-style: italic; }
  #jg-probe { font-size: 12px; margin-bottom: 10px; }
  #jg-probe > summary { cursor: pointer; user-select: none; }
  #jg-probe ul { margin: 6px 0 0; padding-left: 18px; }
  #jg-probe li { margin-bottom: 10px; }
  .jg-probe-name { font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  /* pre-wrap, not the default pre: the literal indentation and line breaks
     of a prose-formatted response ARE the thing being inspected here, but it
     still has to wrap rather than force the page to scroll sideways. */
  .jg-probe-sublabel { margin-top: 6px; opacity: 0.7; font-size: 11px; }
  .jg-probe-literal { border-left: 3px solid rgba(128,128,128,0.5); }
  .jg-probe-body { white-space: pre-wrap; word-break: break-word; margin: 4px 0 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
    background: rgba(128,128,128,0.12); padding: 8px; border-radius: 6px; max-height: 340px; overflow: auto; }
  #jg-debug-fallback { width: 100%; box-sizing: border-box; min-height: 160px; margin-top: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
    background: rgba(128,128,128,0.12); color: inherit; border: 1px solid #999; border-radius: 6px; padding: 8px; }
</style>
</head>
<body>
<details id="jg-errors" hidden>
  <summary></summary>
  <ul></ul>
</details>
<details id="jg-candidates">
  <summary></summary>
  <details data-group="slack"><summary>Slack (0)</summary><ul></ul></details>
  <details data-group="claude"><summary>Claude (0)</summary><ul></ul></details>
  <details data-group="linear"><summary>Linear (0)</summary><ul></ul></details>
</details>
<header>
  <h1>Task Juggler</h1>
  <input id="jg-add-input" type="text" placeholder="Add a task, or paste a Slack/Linear/any link…" />
  <button id="jg-add-btn">Add</button>
  <button id="jg-view-toggle">Toggle view</button>
  <label id="jg-lookback-label" for="jg-lookback-input" title="Widen Slack discovery to catch older threads. Leave blank for the default (last 24h).">Slack since</label>
  <input type="date" id="jg-lookback-input" />
  <button id="jg-refresh-btn">Refresh</button>
  <button id="jg-probe-btn" title="Call session-listing tools and show exactly what they return">Probe</button>
  <button id="jg-copy-debug-btn" title="Copy status, errors, detected candidates, and the last probe result — for pasting back when reporting an issue">Copy Debug Info</button>
  <span id="jg-status"></span>
</header>
<details id="jg-probe" hidden>
  <summary></summary>
  <ul></ul>
</details>
<textarea id="jg-debug-fallback" readonly hidden></textarea>
<div id="jg-list"></div>
<div id="jg-card" hidden></div>
<script id="juggler-seed" type="application/json"></script>
<script type="module">
/*__TASK_JUGGLER_SCRIPT__*/
</script>
</body>
</html>
